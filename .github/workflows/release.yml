name: Build Minified APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Release APK
        run: gradle :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk \
          release/OriginCeiler-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OriginCeiler-Release
          path: release/OriginCeiler-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OriginCeiler Build ${{ github.run_number }}
          files: release/OriginCeiler-release.apk
          generate_release_notes: true
